<svg width="1200" height="620" viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <rect x="30" y="20" width="1140" height="580" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="70" y="60" font-size="24" font-weight="700" fill="#0f172a">Flow: from browser URL to rendered page</text>

  <rect x="70" y="95" width="220" height="90" rx="12" fill="#eef2ff" stroke="#2563eb" stroke-width="2"/>
  <text x="180" y="130" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a8a">1. User</text>
  <text x="180" y="155" text-anchor="middle" font-size="14" fill="#1f2937">enters tusur.ru</text>

  <rect x="360" y="95" width="220" height="90" rx="12" fill="#eff6ff" stroke="#0284c7" stroke-width="2"/>
  <text x="470" y="130" text-anchor="middle" font-size="17" font-weight="700" fill="#0c4a6e">2. DNS</text>
  <text x="470" y="155" text-anchor="middle" font-size="14" fill="#1f2937">domain -> IP address</text>

  <rect x="650" y="95" width="220" height="90" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="760" y="130" text-anchor="middle" font-size="17" font-weight="700" fill="#0f766e">3. Connection</text>
  <text x="760" y="155" text-anchor="middle" font-size="14" fill="#1f2937">TCP + TLS (HTTPS)</text>

  <rect x="940" y="95" width="200" height="90" rx="12" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="1040" y="130" text-anchor="middle" font-size="17" font-weight="700" fill="#854d0e">4. HTTP GET</text>
  <text x="1040" y="155" text-anchor="middle" font-size="14" fill="#1f2937">/ -> HTML</text>

  <rect x="900" y="255" width="240" height="130" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="1020" y="290" text-anchor="middle" font-size="18" font-weight="700" fill="#166534">Web Server</text>
  <text x="1020" y="315" text-anchor="middle" font-size="14" fill="#1f2937">Nginx + Django</text>
  <text x="1020" y="338" text-anchor="middle" font-size="14" fill="#1f2937">URL -> View -> Template</text>
  <text x="1020" y="361" text-anchor="middle" font-size="14" fill="#1f2937">status 200 / 404 / 500</text>

  <rect x="900" y="450" width="240" height="110" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="1020" y="490" text-anchor="middle" font-size="18" font-weight="700" fill="#14532d">Database</text>
  <text x="1020" y="515" text-anchor="middle" font-size="14" fill="#1f2937">PostgreSQL / SQLite</text>
  <text x="1020" y="538" text-anchor="middle" font-size="14" fill="#1f2937">ORM queries</text>

  <rect x="70" y="255" width="760" height="305" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="95" y="290" font-size="20" font-weight="700" fill="#0f172a">5. Browser actions after HTML response</text>

  <rect x="95" y="315" width="345" height="98" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="268" y="342" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Parse HTML and CSS</text>
  <text x="268" y="365" text-anchor="middle" font-size="13" fill="#334155">DOM + CSSOM -> render tree</text>
  <text x="268" y="386" text-anchor="middle" font-size="13" fill="#334155">layout + paint</text>

  <rect x="460" y="315" width="345" height="98" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="632" y="342" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Load resources</text>
  <text x="632" y="365" text-anchor="middle" font-size="13" fill="#334155">CSS, JS, images, fonts</text>
  <text x="632" y="386" text-anchor="middle" font-size="13" fill="#334155">additional HTTP requests</text>

  <rect x="95" y="430" width="710" height="110" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="450" y="458" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Run JavaScript</text>
  <text x="450" y="482" text-anchor="middle" font-size="13" fill="#334155">handle events (click, input), update DOM</text>
  <text x="450" y="504" text-anchor="middle" font-size="13" fill="#334155">fetch('/api/...') -> JSON -> partial page update</text>
  <text x="450" y="526" text-anchor="middle" font-size="13" fill="#334155">without full reload</text>

  <line x1="290" y1="140" x2="360" y2="140" stroke="#1d4ed8" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="580" y1="140" x2="650" y2="140" stroke="#1d4ed8" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="870" y1="140" x2="940" y2="140" stroke="#1d4ed8" stroke-width="3" marker-end="url(#arrow)"/>

  <line x1="1040" y1="185" x2="1040" y2="255" stroke="#1d4ed8" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1020" y1="385" x2="1020" y2="450" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="900" y1="500" x2="830" y2="500" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>

  <line x1="900" y1="300" x2="830" y2="300" stroke="#1d4ed8" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="830" y1="360" x2="900" y2="360" stroke="#1d4ed8" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="860" y="292" font-size="12" fill="#1f2937">HTML / JSON / static files</text>
  <text x="860" y="352" font-size="12" fill="#1f2937">API requests</text>
</svg>
